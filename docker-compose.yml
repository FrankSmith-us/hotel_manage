services:
  mysql:
    image: mysql:8.0
    container_name: hotel_manage_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_hotel_pass
      MYSQL_DATABASE: hotel_manage
      MYSQL_USER: hotel_ops
      MYSQL_PASSWORD: hotel_ops_pass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - hotel_mysql_data:/var/lib/mysql
      - ./server/db/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_hotel_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hotel_mysql_data:
